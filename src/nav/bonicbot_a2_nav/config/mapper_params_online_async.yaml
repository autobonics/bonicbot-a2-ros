slam_toolbox:
  ros__parameters:

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    # This file configures slam_toolbox for MAPPING, launched by slam.launch.py.
    # It owns map->odom while mapping; nav2_amcl must NOT be running at the same
    # time (navigation.launch.py's slam:=true skips AMCL for exactly this reason).
    #
    # Was `mode: localization` pointing at map_file_name /home/dev_ws/my_map_serial
    # — a dev-machine path that does not exist here, so every bringup silently tried
    # and failed to localize instead of mapping. Localization on a saved map is
    # nav2_amcl's job (navigation.launch.py, slam:=false), not slam_toolbox's.
    mode: mapping

    debug_logging: false
    # Load reductions 2026-08-25, all three driven by the same observation:
    # slam_toolbox was dropping scans with "queue is full" continuously on real
    # hardware, from before navigation even started, and the costmaps reported
    # scans "earlier than all the data in the transform cache" — TF lagging its
    # own sensor stream. The RPi4 cannot feed this node at its previous rates.
    # REVERTED to 1 on 2026-08-25. Setting this to 2 to save CPU backfired:
    # slam_toolbox stamps the map->odom transform it publishes as
    # (last processed scan time + transform_timeout), so halving the scan rate
    # halved how often that stamp advances. Combined with dropped scans it left
    # map->odom frozen for 600+ ms at a time, which controller_server sees as
    # "Transform data too old" and then "Controller patience exceeded".
    # Scan throughput here is a latency budget, not just a CPU cost.
    throttle_scans: 1
    transform_publish_period: 0.05   # was 0.02 (50 Hz map->odom); 20 Hz is plenty
    map_update_interval: 2.0   # was 1.0
    resolution: 0.03
    min_laser_range: 0.0 
    max_laser_range: 12.0
    minimum_time_interval: 0.5
    # 0.2 -> 0.5: how far into the future the published map->odom stays valid.
    # Observed freezes reached 0.62 s, well past 0.2, so consumers rejected a
    # transform that was actually still fine. This buys headroom for the gaps
    # rather than pretending they will not happen on an RPi4.
    transform_timeout: 0.5
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000 
    enable_interactive_mode: true

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.3
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1  
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true 
    loop_match_minimum_chain_size: 15
    loop_match_maximum_variance_coarse: 3.0  
    loop_match_minimum_response_coarse: 0.35    
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_dev_wsiation: 0.1 

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_dev_wsiation: 0.03

    distance_variance_penalty: 0.5      
    angle_variance_penalty: 1.0    

    fine_search_angle_offset: 0.00349     
    coarse_search_angle_offset: 0.349   
    coarse_angle_resolution: 0.0349        
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
