# BonicBot A2 docking — Nav2 Docking Server + AprilTag pose detection.
#
# ADDON ONLY. Loaded by docking.launch.py, which only runs on robots carrying
# the docking addon. Full design and verified sim results:
# docs/bonicbot_a2_docking.md

docking_server:
  ros__parameters:
    # use_sim_time is deliberately NOT set here. docking.launch.py passes it
    # AFTER this file, so a value here would be silently overridden and reading
    # it would mislead. Pass use_sim_time:=true to the launch file in sim.
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    # odom, not map: the approach is a short, continuous, closed-loop move and
    # odom is smooth over that distance, where map jumps on every AMCL update.
    # A jump of a few cm during the final approach is a jump in the commanded
    # path. Must match dock_pose_publisher's fixed_frame below.
    fixed_frame: "odom"
    # The docking camera is rear-mounted (docking_camera.xacro), so the robot
    # reverses onto the dock.
    dock_backwards: true
    dock_prestaging_tolerance: 0.5

    dock_plugins: ['dock_charger']
    dock_charger:
      plugin: 'opennav_docking::SimpleChargingDock'

      # ── Approach geometry — verified end-to-end in sim, 2026-09-24 ──────
      #
      # A full dock + undock cycle now runs clean from a cold start: dead
      # straight tracking in both directions (y and yaw pinned near zero the
      # whole way), 73mm final standoff, no oscillation. These five values
      # (docking_threshold, staging_x/yaw_offset, external_detection_rotation_
      # yaw, external_detection_translation_x) are what got it there, and they
      # interact — do not change one without re-verifying the others against a
      # live /staging_pose and /dock_pose (both are always published; read
      # them, do not re-derive from the opennav_docking source, which does not
      # reliably match the behavior of the installed binary — see the
      # staging_x/yaw_offset note below for how that was discovered).
      #
      # docking_threshold covers a real 0.25m gap: SimpleChargingDock's
      # isDocked() checks distance to dock_pose_ directly, but the control law
      # actually drives toward dock_pose_ + a fixed 0.25m internal
      # "backward_projection" margin (docking_server.cpp, not configurable).
      # 0.05 (upstream's default) is smaller than that gap, so isDocked()
      # structurally could never fire — the robot would reach its own control
      # target and stop advancing (r=0 in the control law) 0.25m before ever
      # satisfying the success check. 0.28 covers the gap with a small margin.
      docking_threshold: 0.28

      # Forward offset (metres) of the undock staging point from the robot's
      # docked position, and the staging heading offset. Both were measured
      # empirically via /staging_pose during a live undock, not derived from
      # source: reading simple_charging_dock.cpp's getStagingPose() and
      # docking_server.cpp's undockRobot() predicts an internal "+pi" flip on
      # the robot's heading before staging is computed from it — but the
      # observed /staging_pose (x=-4.309, yaw=-179.96 from a robot docked at
      # x=-3.607, yaw=0.04) only matches if that flip does NOT happen on this
      # installed opennav_docking build. Signs below are calibrated against
      # that measured reality, not the source. With the old upstream defaults
      # (staging_x_offset -0.7, matching a flip that isn't occurring) the
      # undock target computed 0.7m BEHIND the docked robot, into the dock and
      # the wall, and the robot arced into it on one wheel trying to reach it.
      staging_x_offset: 0.7
      staging_yaw_offset: 0.0

      use_external_detection_pose: true
      # /battery_state is published by the ESP hardware interface on A2
      # (RESP_BATTERY over CDC — voltage, current and SOC are live), so the
      # "am I charging yet" check needs no new wiring on real hardware.
      #
      # IN SIMULATION THERE IS NO BATTERY. Nothing publishes /battery_state
      # under Gazebo, so with this true the dock will drive the approach
      # correctly and then sit in wait_charge_timeout before reporting
      # failure — a real success reported as a failure. Launch docking.launch.py
      # with use_battery_status:=false for sim runs; leave this true for the
      # real robot.
      use_battery_status: true
      use_stall_detection: false

      # 3.0, up from the 1.0 upstream default. The docking camera produces
      # occasional single-frame dropouts rather than a perfectly steady
      # stream. At ~3-7 Hz, two or three consecutive dropped frames costs over
      # a second and tripped detection loss at the 1.0s default on nearly
      # every approach. 3.0s absorbs that while staying well inside
      # dock_approach_timeout (30s), so a genuinely lost dock is still caught
      # long before that ceiling.
      external_detection_timeout: 3.0

      # Offset from the detected AprilTag pose to the dock's actual approach
      # target. y/roll/pitch are 0 — the tag is assumed centred on the dock
      # face with no roll/pitch error. rotation_yaw and translation_x are the
      # two values that matter and both were found empirically (see the
      # staging_x/yaw_offset note above for why source-reading these was
      # actively misleading on this build):
      #
      #   rotation_yaw: 1.5708 — swept against live /dock_pose readings
      #   (0.0->dock_yaw +90, +1.5708->0, 3.14159->-90, -1.5708->+180) and
      #   picked to land dock_pose_'s yaw at 0, which is what backward=true
      #   motion needs for a straight-line approach with zero net turning.
      #
      #   translation_x: -0.08 gives a 73mm final standoff (rear of chassis to
      #   dock face). Increase the magnitude (more negative) to stop further
      #   in / closer contact; decrease it (toward 0 or positive) to stop
      #   further out. It moves BOTH dock_pose_ and the control law's actual
      #   target equally, so docking_threshold's 0.25m margin above is
      #   unaffected by changes here.
      #
      # Real dock geometry (contact offset from the tag, mount roll/pitch)
      # still needs measuring once a physical dock exists — these values are
      # sim-calibrated for obstacle_world.sdf's apriltag_dock model.
      #
      # -0.092 (2026-09-24, was -0.08): the dock is now the CAD station
      # (a2-docking-station.glb), whose docked pose puts the chassis rear
      # 62.5 mm from the station face with the brass pins on the robot's
      # contacts. -0.08 was tuned for the old box dock and would stop ~8 mm
      # short of the pins on the new one. Not yet re-verified in sim.
      external_detection_translation_x: -0.092
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: 0.0
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_yaw: 1.5708
      filter_coef: 0.1

    # ── NO `docks:` DATABASE, EXCEPT ONE DUMMY ENTRY ─────────────────────
    #
    # The dock pose arrives WITH each action call instead: `use_dock_id: false`
    # plus an explicit `dock_pose`, sourced from robot_app's LocationStore
    # (docs/bonicbot_a2_docking.md §4) rather than a static entry here. That
    # keeps docks per-map, re-recordable, and automatically dropped when their
    # map is deleted.
    #
    # The dummy entry below exists only because opennav_docking's
    # on_configure() unconditionally requires a non-empty dock database —
    # confirmed on a real run: with no `docks:` at all, docking_server refused
    # to configure ("Dock database filepath nor dock parameters set. Unable to
    # perform docking actions."), and lifecycle_manager_docking never reached
    # active. Every real DockRobot call still passes use_dock_id: false and
    # supplies its own pose, bypassing this dummy entirely — do not treat it
    # as a real dock or edit its pose expecting it to mean anything.
    docks: ['dummy_dock']
    dummy_dock:
      type: 'dock_charger'
      frame: 'odom'
      pose: [0.0, 0.0, 0.0]

# apriltag_ros's apriltag_node (github.com/christianrauch/apriltag_ros) — CPU
# AprilTag detector. Subscribes image_rect + camera_info, publishes /tf (child
# frame tag<family>:<id>) and detections (apriltag_msgs/AprilTagDetectionArray,
# with NO embedded pose — which is why dock_pose_publisher.py exists).
#
# THE KEY MUST BE THE FULLY-QUALIFIED NODE NAME, NAMESPACE INCLUDED.
# docking.launch.py puts this node in the `docking_camera` namespace, so its
# FQN is /docking_camera/apriltag_node. A bare `apriltag_node:` key does NOT
# match it — ROS 2 silently ignores the whole block and every parameter below
# falls back to the package default. Found the hard way: the default family is
# ALSO 36h11, so detection kept working while the default `size` of 1.0m
# (against the real 0.10m tag) scaled every pose by 10x with no error anywhere
# — the tag reported 10.58m away while sitting 0.84m from the camera.
#   Verify, don't assume:  ros2 param get /docking_camera/apriltag_node size
/docking_camera/apriltag_node:
  ros__parameters:
    family: '36h11'
    # The constraint is keeping the tag IN FRAME at close range, not detection
    # range: a larger tag overflows a 640x480 frame in the final centimetres
    # of the approach, which is the worst possible moment to lose the pose. At
    # 10 cm this camera detects comfortably past 2 m and stays fully framed
    # down to ~0.12 m. See docs/bonicbot_a2_docking.md §2.1.
    #
    # MUST equal the printed tag's BLACK BORDER edge length — not the paper
    # size, not the white margin. Wrong here and every pose is scaled wrong,
    # with no error anywhere: the tag is detected, the distance is simply
    # false. In sim, this must match the textured plate's geometry in
    # obstacle_world.sdf's apriltag_dock (see that model's tag_plate comment).
    size: 0.10

# Our own node — scripts/dock_pose_publisher.py.
dock_pose_publisher:
  ros__parameters:
    # Dock on whichever tag is seen first. Correct while there is exactly one
    # tag in the environment, which is the case today. Set false and fill in
    # dock_tag_id once a site has more than one dock.
    use_first_detection: true
    dock_tag_family: 'tag36h11'
    dock_tag_id: 0
    # MUST match docking_server's fixed_frame above — this is the frame the
    # PoseStamped is published in, and docking_server assumes they agree.
    fixed_frame: 'odom'
