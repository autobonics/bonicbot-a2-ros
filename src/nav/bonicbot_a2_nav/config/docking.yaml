# BonicBot A2 docking — Nav2 Docking Server + AprilTag pose detection.
#
# ADDON ONLY. Loaded by docking.launch.py, which only runs on robots carrying
# the docking addon. Full design: docs/bonicbot_a2_docking.md
#
# Mirrors bonicbot_m1_nav/config/docking.yaml, which in turn mirrors the
# reference Nav2's own docking tutorial points to (NVIDIA-ISAAC-ROS/nova_carter,
# nova_carter_docking.yaml). ONE structural difference from both, and it is the
# centre of the A2 design: there is no `docks:` database here. See below.

docking_server:
  ros__parameters:
    # use_sim_time is deliberately NOT set here. docking.launch.py passes it
    # AFTER this file, so a value here would be silently overridden and reading
    # it would mislead. Pass use_sim_time:=true to the launch file in sim.
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    # odom, not map: the approach is a short, continuous, closed-loop move and
    # odom is smooth over that distance, where map jumps on every AMCL update.
    # A jump of a few cm during the final approach is a jump in the commanded
    # path. Must match dock_pose_publisher's fixed_frame below.
    fixed_frame: "odom"
    # The docking camera is rear-mounted, so the robot reverses onto the dock.
    # Same as M1. See docking_camera.xacro's joint for the geometry.
    dock_backwards: true
    dock_prestaging_tolerance: 0.5

    dock_plugins: ['dock_charger']
    dock_charger:
      plugin: 'opennav_docking::SimpleChargingDock'
      # 5 cm — the reference implementation's own default. NOT yet validated
      # against A2's charging-contact geometry.
      docking_threshold: 0.28
      # How far out the robot stages before the final approach. Upstream
      # default; re-measure once a real dock exists.
      staging_x_offset: -0.7
      # MUST BE pi FOR A REAR-MOUNTED CAMERA. Verified against the Humble
      # source: simple_charging_dock.cpp never reads dock_backwards — it sets
      # the staging heading as exactly (dock_yaw + staging_yaw_offset).
      # dock_backwards lives in the docking_server and only flips the approach
      # controller's drive direction; it does NOT turn the robot around.
      #
      # Left at the 0.0 default the staging heading came out 180 deg — nose
      # toward the dock — so the robot SPUN 180 deg on the spot, which pointed
      # the rear docking camera away from the tag, lost detection, and aborted
      # with error 904. With pi the heading is 180+180=0: the robot faces away
      # from the dock, camera on the tag, and reverses in.
      staging_yaw_offset: 0.0
      use_external_detection_pose: true
      # CONFIRMED UPSTREAM BUG, 2026-09-23 — not this repo's config, not the
      # camera, not the calibration. Isolated by setting this false for one
      # test: docking_server then drives to the goal's static dock_pose with
      # NO further camera/detection involvement at all (getStagingPose():
      # "if (!use_external_detection_pose_) { dock_pose_.pose = pose; }" —
      # opennav_docking humble branch). The approach still oscillated forever
      # (yaw swinging -26deg..+49deg, y drifting to 0.26m, never settling) with
      # zero vision in the loop, proving the divergence is in the control law.
      #
      # Root cause, read from nav2_graceful_controller's SmoothControlLaw
      # (humble branch, calculateRegularVelocity): for backward=true it negates
      # BOTH curvature and v (so their product w is unchanged) but never
      # mirrors the heading-error terms (phi/delta), which stay referenced to
      # the robot's FRONT. The correction is applied in the wrong rotational
      # sense while reversing, so error grows instead of shrinking.
      #
      # docking_server itself is fine — it rotates the target pose by pi for
      # dock_backwards (docking_server.cpp) exactly as documented. The bug is
      # one level down, in the controller humble's opennav_docking depends on.
      # A fix needs a patched SmoothControlLaw (or an overridden controller
      # plugin) upstream; nothing in this repo can work around it in config.
      # /battery_state is published by the ESP hardware interface on A2
      # (RESP_BATTERY over CDC — voltage, current and SOC are live), so the
      # "am I charging yet" check needs no new wiring.
      #
      # IN SIMULATION THERE IS NO BATTERY. Nothing publishes /battery_state
      # under Gazebo, so the dock will drive the approach correctly and then sit
      # in wait_charge_timeout before reporting failure. That is the expected
      # sim outcome — set this false, or expect the final state to fail while
      # the approach itself succeeds. docs/bonicbot_a2_docking.md's sim steps
      # cover this.
      use_battery_status: true
      use_stall_detection: false

      # 3.0, up from the 1.0 upstream default. Measured 2026-09-23: this sim's
      # docking_camera sensor produces intermittent BLANK frames (single flat
      # colour, no scene) while its parent link is actively rotating — not a
      # permanent freeze, a per-frame flicker, real frames interleaved with
      # blanks (Ogre2 render/pose-update race under gz-sim Fortress, not
      # something this repo's config can fix). At the camera's own ~2.6 Hz,
      # 2-3 consecutive blanks costs over a second and tripped detection loss
      # every single approach at the 1.0s default. 3.0s comfortably tolerates
      # the flicker while staying fast relative to dock_approach_timeout (30s)
      # — a genuinely lost dock is still caught well before that ceiling.
      external_detection_timeout: 3.0
      # Offset from the detected AprilTag pose to the dock's actual charging
      # contact point. Zero is a PLACEHOLDER, not a measurement — the tag is
      # never exactly at the contacts. Must be measured once a physical dock
      # exists, and it is the number that decides whether the robot stops on
      # the contacts or 18 cm short of them. (The reference's own values are
      # -0.18 / -1.57 / -1.57 for its hardware — different hardware, so not
      # transferable, but an indication of the magnitude involved.)
      # SIM VALUES, measured 2026-09-23 — re-measure for real hardware.
      #
      # READ THIS BEFORE TOUCHING THE ROTATIONS. Two upstream facts make the
      # obvious reasoning wrong, and both cost a crashed robot to find:
      #
      # 1. These params ONLY refine the live detection (getRefinedPose). They do
      #    NOT affect the staging pose. getStagingPose() derives staging purely
      #    from the yaw of the dock_pose IN THE ACTION GOAL. So a goal carrying
      #    a raw AprilTag pose (optical convention, yaw ~90 deg here) stages the
      #    robot 0.7 m SIDEWAYS and it drives off at right angles to the dock.
      #    The goal's dock_pose must be a proper 2D dock pose: theta such that
      #    staging_x_offset (negative = "forward of dock") lands in front of it.
      #    For a dock whose face points +X, that is theta = pi.
      #
      # 2. simple_charging_dock.cpp builds the rotation with
      #        setEuler(pitch, roll, yaw)
      #    but tf2's signature is setEuler(yaw, pitch, roll) — so these
      #    parameter names do NOT map to the axes they are named after.
      #    Do not derive these analytically. Measure them: publish a goal, read
      #    /dock_pose and /staging_pose, and check the yaw you actually get.
      #
      # yaw=-1.5708 was found that way: it is the value that turns this dock's
      # detected tag (yaw +90) into a dock frame with yaw +180. Swept and
      # confirmed: 0.0->+90, +1.5708->0, 3.14159->-90, -1.5708->+180.
      #
      # translation_x: applied along the (now 180-deg) dock x-axis, so it moves
      # the target in +X by -tx. The robot must stop with its REAR at the dock
      # face, not base_link on the tag: chassis is 0.228 long (rear =
      # base_link-0.114) and the sim dock face is at -3.800 with the tag at
      # -3.810, giving a base_link target of -3.686, i.e. tx = -0.124.
      external_detection_translation_x: -0.130
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: 0.0
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_yaw: 1.5708
      filter_coef: 0.1

    # ── NO `docks:` DATABASE — this is the A2 divergence ─────────────────
    #
    # M1 records a static `home_dock` pose here, obtained by a five-step manual
    # procedure (park on dock, start AMCL, echo /amcl_pose, convert quaternion
    # to yaw, edit this file, rebuild, redeploy).
    #
    # A2 already ships that procedure as working code: robot_app's LocationStore
    # records a pose from the live localized position and refuses if AMCL has
    # not converged. So the dock pose arrives WITH the action call —
    # `use_dock_id: false` plus an explicit `dock_pose` — and docks become
    # per-map, re-recordable, and dropped automatically when their map is
    # deleted. See docs/bonicbot_a2_docking.md §4.
    #
    # IF docking_server REFUSES TO CONFIGURE, this is the first thing to check.
    # opennav_docking builds a dock database at on_configure() and may require
    # either `docks:` or `dock_database:` to be set. The symptom is a failure
    # during configure, on a line naming the dock database, followed by
    # lifecycle_manager_docking never reaching active. The fallback is a single
    # dummy entry that every call then bypasses — uncomment:
    #
    # CONFIRMED on hardware (obstacle_world.sdf sim run, 2026-09-23):
    # docking_server refused to configure with no dock database at all —
    #   "Dock database filepath nor dock parameters set. Unable to perform
    #    docking actions."
    # — so this is not a fallback for an edge case, it is REQUIRED every time.
    docks: ['dummy_dock']
    dummy_dock:
      type: 'dock_charger'
      frame: 'odom'
      pose: [0.0, 0.0, 0.0]

    # Do NOT treat the entry above as a real dock. It exists only to satisfy
    # opennav_docking's on_configure(), which unconditionally requires a
    # non-empty dock database — every DockRobot call still passes
    # use_dock_id: false and supplies its own pose, bypassing this entirely.

# apriltag_ros's apriltag_node (github.com/christianrauch/apriltag_ros) — CPU
# AprilTag detector. Subscribes image_rect + camera_info, publishes /tf (child
# frame tag<family>:<id>) and detections (apriltag_msgs/AprilTagDetectionArray,
# with NO embedded pose — which is why dock_pose_publisher.py exists).
#
# THE KEY MUST BE THE FULLY-QUALIFIED NODE NAME, NAMESPACE INCLUDED.
# docking.launch.py puts this node in the `docking_camera` namespace, so its
# FQN is /docking_camera/apriltag_node. A bare `apriltag_node:` key does NOT
# match it — ROS 2 silently ignores the whole block and every parameter below
# falls back to the package default.
#
# Found on hardware 2026-09-23, and it is a nasty one because it half-works:
# the default family is ALSO 36h11, so detection succeeded normally while the
# default `size` of 1.0 m (against our real 0.10 m) scaled every pose by 10x —
# the tag was reported 10.58 m away while sitting 0.84 m from the camera.
# Nothing errors; the dock is simply in the wrong place.
#   Verify, don't assume:  ros2 param get /docking_camera/apriltag_node size
/docking_camera/apriltag_node:
  ros__parameters:
    family: '36h11'
    # 10 cm, against M1's 20 cm — and this is a decision, not a copy. The
    # constraint is keeping the tag IN FRAME at close range, not detection
    # range: a 20 cm tag overflows a 640x480 frame in the final centimetres of
    # the approach, which is the worst possible moment to lose the pose. At
    # 10 cm this camera detects comfortably past 2 m and stays fully framed
    # down to ~0.12 m. See docs/bonicbot_a2_docking.md §2.1.
    #
    # MUST equal the printed tag's BLACK BORDER edge length — not the paper
    # size, not the white margin. Wrong here and every pose is scaled wrong,
    # with no error anywhere: the tag is detected, the distance is simply
    # false. In sim, this must match the textured plate's geometry in
    # obstacle_world.sdf's apriltag_dock (see that model's tag_plate comment).
    size: 0.10

# Our own node — scripts/dock_pose_publisher.py, copied verbatim from M1.
dock_pose_publisher:
  ros__parameters:
    # Dock on whichever tag is seen first. Correct while there is exactly one
    # tag in the environment, which is the case today. Set false and fill in
    # dock_tag_id once a site has more than one dock.
    use_first_detection: true
    dock_tag_family: 'tag36h11'
    dock_tag_id: 0
    # MUST match docking_server's fixed_frame above — this is the frame the
    # PoseStamped is published in, and docking_server assumes they agree.
    fixed_frame: 'odom'
