twist_mux:
  ros__parameters:
    # TwistStamped on every input and on the output, which feeds diff_cont's
    # /diff_cont/cmd_vel directly (Jazzy's diff_drive_controller takes nothing
    # else). Every publisher into the lanes below must send TwistStamped too:
    # Nav2 (enable_stamped_cmd_vel in nav2_params.yaml), teleop_twist_joy
    # (publish_stamped_twist in joystick.yaml) and robot_app.
    use_stamped: true
    topics:
      navigation:
        topic   : cmd_vel
        timeout : 0.5
        priority: 10
   
      joystick:
        topic   : cmd_vel_joy
        timeout : 0.5
        priority: 100